[project]
name = "mcp-applemusic-nodesaint"
version = "0.2.3"
description = "An MCP server that gives Claude control of Apple Music: playback, library search, and playlist management"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "NodeSaint" }]
keywords = ["mcp", "model-context-protocol", "apple-music", "applescript", "claude", "music", "macos"]
dependencies = ["mcp>=1.28.1"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
]

[project.urls]
Homepage = "https://nodesaint.github.io/mcp-applemusic/"
Repository = "https://github.com/NodeSaint/mcp-applemusic"
Changelog = "https://github.com/NodeSaint/mcp-applemusic/blob/main/CHANGELOG.md"

[project.scripts]
mcp-applemusic-nodesaint = "mcp_applemusic.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_applemusic"]
